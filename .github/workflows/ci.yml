name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Phase 1: Graph validation & root gap tests ──────────────────────────────
  graph:
    name: Validate knowledge graph & algorithms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install networkx pytest

      - name: Validate graph data files
        run: python scripts/validate_graph.py

      - name: Verify graph.json is up-to-date
        run: python scripts/build_graph.py --check

      - name: Run root gap and knowledge graph tests
        run: pytest ml-service/tests/test_graph.py -v

  # ── Future jobs (uncomment as phases complete) ─────────────────────────────
